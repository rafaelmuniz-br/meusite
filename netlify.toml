[build]
  command = "npm run generate"
  publish = ".output/public"

[build.environment]
  # Nuxt 4.5 exige Node >= 22.19 — fixar versão exata pra não cair num 22.x antigo
  NODE_VERSION = "22.19.0"
  NPM_VERSION = "10"
  # mais heap pro prerender não estourar a memória do builder
  NODE_OPTIONS = "--max-old-space-size=4096"
  # build igual ao local (o Netlify força "netlify-static" por padrão)
  NITRO_PRESET = "static"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
